name: Сборка APK

# Когда запускать:
#  - push в main или тег вида v1.0.0
#  - pull request в main (проверка сборки)
#  - вручную со вкладки Actions (когда workflow есть в ветке по умолчанию)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Подготовить Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Собрать debug и release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # Постоянный ключ подписи ZI-Voice (подробности: SIGNING.md).
      # Источник ключа (по приоритету):
      #   1) секреты репозитория: APK_KEYSTORE_BASE64, APK_KEYSTORE_PASSWORD, APK_KEY_ALIAS, APK_KEY_PASSWORD
      #   2) файл в репозитории: signing/zi-voice.keystore + signing/keystore-password.txt
      # Одним ключом подписываются и debug, и release APK, поэтому любая новая
      # сборка ставится поверх предыдущей как обновление.
      - name: Подписать APK постоянным ключом
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          KS=""; KSPASS=""; KSALIAS="zi-voice"; KPPASS=""
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zi-voice.keystore"
            KS="$RUNNER_TEMP/zi-voice.keystore"
            KSPASS="$KEYSTORE_PASSWORD"
            KSALIAS="${KEY_ALIAS:-zi-voice}"
            KPPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Источник ключа: секреты репозитория"
          elif [ -f signing/zi-voice.keystore ]; then
            KS="signing/zi-voice.keystore"
            KSPASS="$(cat signing/keystore-password.txt)"
            KSALIAS="${KEY_ALIAS:-zi-voice}"
            KPPASS="$KSPASS"
            echo "Источник ключа: файл signing/zi-voice.keystore из репозитория"
          fi
          if [ -z "$KS" ]; then
            echo "::warning::Ключ подписи не найден (нет секретов и файла signing/zi-voice.keystore) — APK останутся подписанными отладочным ключом Gradle"
          else
            sign_one () {
              local src="$1" dst="$2"
              "$BT/zipalign" -f -p 4 "$src" "$RUNNER_TEMP/aligned.apk"
              "$BT/apksigner" sign \
                --ks "$KS" \
                --ks-key-alias "$KSALIAS" \
                --ks-pass "pass:$KSPASS" \
                --key-pass "pass:$KPPASS" \
                --out "$dst" "$RUNNER_TEMP/aligned.apk"
            }
            sign_one app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ZI-Voice-debug.apk
            sign_one app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ZI-Voice-release.apk
            echo "=== Сертификат подписи (debug) ==="
            "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/ZI-Voice-debug.apk
            echo "=== Сертификат подписи (release) ==="
            "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/ZI-Voice-release.apk
            {
              echo "## 🔏 Подпись APK"
              echo '```'
              "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/ZI-Voice-release.apk
              echo '```'
              echo "Ожидаемый SHA-256: \`96:0C:FF:48:9F:12:0C:6E:5E:55:1A:81:D7:50:8B:5F:1D:D7:75:43:3E:C4:48:5F:C7:10:CA:E4:3F:77:2F:0D\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Переименовать APK
        run: |
          cd app/build/outputs/apk
          [ -f debug/ZI-Voice-debug.apk ] || cp debug/app-debug.apk debug/ZI-Voice-debug.apk
          [ -f release/ZI-Voice-release.apk ] || cp release/app-release-unsigned.apk release/ZI-Voice-release-unsigned.apk
          ls -la debug release

      - name: Загрузить артефакт ZI-Voice-debug
        uses: actions/upload-artifact@v4
        with:
          name: ZI-Voice-debug
          path: app/build/outputs/apk/debug/ZI-Voice-debug.apk
          if-no-files-found: error

      - name: Загрузить артефакт ZI-Voice-release
        uses: actions/upload-artifact@v4
        with:
          name: ZI-Voice-release
          path: app/build/outputs/apk/release/ZI-Voice-release*.apk
          if-no-files-found: error

  release:
    name: Публикация GitHub Release
    # Выполняется только для тегов вида v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачать APK из сборки
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Создать GitHub Release с APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apks/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZI-Voice $GITHUB_REF_NAME" \
            --notes "Автоматическая сборка для тега $GITHUB_REF_NAME.

          - ZI-Voice-debug.apk — debug-сборка
          - ZI-Voice-release.apk — релизная сборка

          Оба APK подписаны постоянным ключом ZI-Voice (см. SIGNING.md)
          и устанавливаются поверх предыдущих версий как обновление.
          Перед установкой новой версии увеличьте versionCode в app/build.gradle.kts."
