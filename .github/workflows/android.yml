name: Сборка APK

# Когда запускать:
#  - push в main или тег вида v1.0.0
#  - pull request в main (проверка сборки)
#  - вручную со вкладки Actions (когда workflow есть в ветке по умолчанию)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Подготовить Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Собрать debug и release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Переименовать debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ZI-Voice-debug.apk

      # Опционально: подпись релизного APK секретами репозитория.
      # Шаг выполняется только если задан секрет APK_KEYSTORE_BASE64.
      # Нужные секреты: APK_KEYSTORE_BASE64, APK_KEYSTORE_PASSWORD, APK_KEY_ALIAS, APK_KEY_PASSWORD
      - name: Подписать release APK (если настроены секреты)
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zi-voice.keystore"
          "$BT/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/zi-voice.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/ZI-Voice-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Переименовать release APK
        run: |
          cd app/build/outputs/apk/release
          if [ -f ZI-Voice-release.apk ]; then
            echo "APK подписан через секреты"
          else
            cp app-release-unsigned.apk ZI-Voice-release-unsigned.apk
          fi

      - name: Загрузить артефакт ZI-Voice-debug
        uses: actions/upload-artifact@v4
        with:
          name: ZI-Voice-debug
          path: app/build/outputs/apk/debug/ZI-Voice-debug.apk
          if-no-files-found: error

      - name: Загрузить артефакт ZI-Voice-release
        uses: actions/upload-artifact@v4
        with:
          name: ZI-Voice-release
          path: app/build/outputs/apk/release/ZI-Voice-release*.apk
          if-no-files-found: error

  release:
    name: Публикация GitHub Release
    # Выполняется только для тегов вида v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачать APK из сборки
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Создать GitHub Release с APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apks/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZI-Voice $GITHUB_REF_NAME" \
            --notes "Автоматическая сборка для тега $GITHUB_REF_NAME.

          - ZI-Voice-debug.apk — debug-сборка (устанавливается на любое устройство)
          - ZI-Voice-release-unsigned.apk — релизная сборка без подписи (для публикации нужно подписать)"
